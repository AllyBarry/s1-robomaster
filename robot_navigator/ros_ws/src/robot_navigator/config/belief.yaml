belief_node:
  ros__parameters:
    robot_id: 0
    # Grid footprint in field metres. Matches the apriltag_detector field
    # (0,0) to (3.0,3.0) defined in rpi_ir_apriltag/.../config/field.yaml.
    # 15×15 at 0.2 m → 3.0 m × 3.0 m, exactly matching the physical field
    # so the RViz boundary and belief overlay align.
    grid_resolution: 0.2
    grid_origin_x: 0.0
    grid_origin_y: 0.0
    grid_width: 15
    grid_height: 15
    # Belief updates once per new grid cell. This is a small metric floor
    # (m) applied on top to ignore pose-noise jitter. Keep well under
    # grid_resolution.
    min_displacement: 0.05
    # RFF+BLR hyperparameters — see belief.py for details.
    num_features: 256
    lengthscale: 0.6
    prior_std: 1.0
    # Scaled to the 0.2 m cell regime: typical |gx_obs| ≈ Δr ≈ 0.2, so the
    # BLR noise must be well below that or posterior updates get damped to
    # zero. Sim uses 0.3 with 0.5 m cells (~0.6× typical signal) — this
    # keeps the same ratio.
    noise_std: 0.15
    forgetting: 0.999
    publish_rate_hz: 2.0
    field_frame: "field"
    # Set true to have this node publish UCB-driven waypoints for the
    # navigator to follow. Off by default — belief-only visualisation.
    publish_waypoints: false
    # Exploit-biased UCB (α > β). Earlier β=10 drew the robot to
    # perimeter cells (permanently high-σ because their outward
    # neighbours can't be sampled) causing edge oscillation.
    ucb_alpha: 2.0
    ucb_beta: 1.5
    waypoint_tolerance: 0.15
    # Draw a gradient arrow for every Nth cell. 1 = all cells.
    gradient_subsample: 1
    random_seed: 42
    # Peer-aware collision avoidance: peer_robot_ids is set via launch arg
    # (e.g. peer_robot_ids:=1,2) — omitted here because empty YAML lists get
    # misinferred as BYTE_ARRAY at param-load time. Each peer subtracts a
    # Gaussian penalty from candidate cells during UCB selection.
    # repulsion_radius is the 1-σ radius (m); repulsion_weight is the peak
    # penalty added at a peer's current cell.
    #
    # Sized for 0.30 m diameter robots in the 2.5×2.5 m field. The mask
    # boundary matches the reactive layer's avoidance_radius (0.50 m) so
    # the planner never commits to a cell that would force the reactive
    # layer into conflict with the goal-pull. Gaussian σ sits inside the
    # mask so the soft penalty rises smoothly as candidate cells approach
    # the hard boundary; weight is scaled to dominate a typical UCB
    # margin (α·μ + β·σ ≈ 1.5–2.0 with α=2.0, β=1.5).
    #
    # Mask radius MUST be ≤ formation_spacing (or robots can't reach
    # their own targets — peer A at target_A would mask the cell at
    # target_B). Current global_feedback.yaml uses formation_spacing=0.7,
    # leaving 0.20 m of margin between the mask boundary and the
    # neighbouring target.
    repulsion_weight: 5.0
    repulsion_radius: 0.40
    # Drop from 1.0s → 0.4s: matches the reactive layer so both state
    # machines agree on which peers are "live"; caps unobserved peer
    # drift at 0.08 m at 0.2 m/s, well inside the noise budget.
    peer_pose_timeout: 0.40
    # Hard action mask: destination cells within this radius (m) of any
    # fresh peer are removed from the UCB candidate set. Takes precedence
    # over the Gaussian penalty when set. 0 = disabled (penalty only).
    peer_mask_radius: 0.50
    # Planner-layer (UCB) repulsion is ON by default — needed in concert
    # with the reactive layer for collision-free operation. Toggle live
    # by publishing Bool on /collision_avoidance_enabled. Controls BOTH
    # the Gaussian penalty and the hard mask.
    repulsion_enabled: true
    # Edge-margin penalty: keeps UCB waypoints away from the grid
    # boundary. Linear falloff — cells `edge_margin_cells` or more from
    # every edge pay nothing; the outermost ring pays the full weight.
    # Set edge_margin_cells: 0 to disable.
    edge_margin_cells: 2
    edge_margin_weight: 5.0
    # Hold / probe mechanism — 1-bit coordination channel. When one
    # robot raises its bit, peers freeze at their current cell so Δr
    # is attributable to the single mover. OFF by default — the
    # baseline ./run_belief_and_reward.sh is plain UCB + repulsion.
    # Enable via ./run_belief_and_reward_hold.sh (or pass
    # hold_enabled:=true on the launch line) to run the probe model
    # for comparison.
    # Trigger (hand-tuned):
    #   - hold_info_margin:   raise only when my best UCB score beats
    #                         second-best by this absolute margin
    #   - hold_reward_delta_threshold: and recent peak-to-peak reward
    #                         change over hold_reward_window_sec is
    #                         below this (group is stuck learning)
    hold_enabled: false
    hold_duration_sec: 3.0
    hold_cooldown_sec: 4.0
    hold_info_margin: 1.0
    hold_reward_window_sec: 3.0
    hold_reward_delta_threshold: 0.05
    # Soft-hold credit assignment — continuous, always-on alternative to
    # the 1-bit hold above. Importance-weights each BLR sample by how
    # attributable Δr is to this robot's motion (vs concurrent peer
    # motion observed via the existing /field/robot_{i}/pose subs). Zero
    # extra bandwidth. OFF by default — enable via
    # ./run_belief_and_reward_soft.sh (or pass soft_hold_enabled:=true).
    soft_hold_enabled: false
    soft_hold_weight_floor: 0.05
    soft_hold_eps_m: 0.02
