belief_node:
  ros__parameters:
    robot_id: 0
    # Grid footprint in field metres. Matches the apriltag_detector field
    # (0,0) to (3,2) defined in rpi_ir_apriltag/.../config/field.yaml.
    grid_resolution: 0.2
    grid_origin_x: 0.0
    grid_origin_y: 0.0
    grid_width: 15
    grid_height: 10
    # Belief update fires once the robot has moved this far (m) since the
    # last update.
    displacement_threshold: 0.25
    # RFF+BLR hyperparameters — see belief.py for details.
    num_features: 256
    lengthscale: 0.6
    prior_std: 1.0
    noise_std: 0.5
    forgetting: 0.999
    publish_rate_hz: 2.0
    field_frame: "field"
    # Set true to have this node publish UCB-driven waypoints for the
    # navigator to follow. Off by default — belief-only visualisation.
    publish_waypoints: false
    ucb_alpha: 1.0
    ucb_beta: 10.0
    waypoint_tolerance: 0.15
    # Draw a gradient arrow for every Nth cell. 1 = all cells.
    gradient_subsample: 1
    random_seed: 42
    # Peer-aware collision avoidance: peer_robot_ids is set via launch arg
    # (e.g. peer_robot_ids:=1,2) — omitted here because empty YAML lists get
    # misinferred as BYTE_ARRAY at param-load time. Each peer subtracts a
    # Gaussian penalty from candidate cells during UCB selection.
    # repulsion_radius is the 1-σ radius (m); repulsion_weight is the peak
    # penalty added at a peer's current cell.
    repulsion_weight: 3.0
    repulsion_radius: 0.25
    peer_pose_timeout: 1.0
