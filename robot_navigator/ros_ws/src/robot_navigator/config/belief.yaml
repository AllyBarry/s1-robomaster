belief_node:
  ros__parameters:
    robot_id: 0
    # Grid footprint in field metres. Matches the apriltag_detector field
    # (0,0) to (3.0,3.0) defined in rpi_ir_apriltag/.../config/field.yaml.
    # 15×15 at 0.2 m → 3.0 m × 3.0 m, exactly matching the physical field
    # so the RViz boundary and belief overlay align.
    grid_resolution: 0.2
    grid_origin_x: 0.0
    grid_origin_y: 0.0
    grid_width: 15
    grid_height: 15
    # Belief updates once per new grid cell. This is a small metric floor
    # (m) applied on top to ignore pose-noise jitter. Keep well under
    # grid_resolution.
    min_displacement: 0.05
    # RFF+BLR hyperparameters — see belief.py for details.
    num_features: 256
    lengthscale: 0.6
    prior_std: 1.0
    # Scaled to the 0.2 m cell regime: typical |gx_obs| ≈ Δr ≈ 0.2, so the
    # BLR noise must be well below that or posterior updates get damped to
    # zero. Sim uses 0.3 with 0.5 m cells (~0.6× typical signal) — this
    # keeps the same ratio.
    noise_std: 0.15
    forgetting: 0.999
    publish_rate_hz: 2.0
    field_frame: "field"
    # Set true to have this node publish UCB-driven waypoints for the
    # navigator to follow. Off by default — belief-only visualisation.
    publish_waypoints: false
    # Exploit-biased UCB (α > β). Earlier β=10 drew the robot to
    # perimeter cells (permanently high-σ because their outward
    # neighbours can't be sampled) causing edge oscillation.
    ucb_alpha: 2.0
    ucb_beta: 1.5
    waypoint_tolerance: 0.15
    # Draw a gradient arrow for every Nth cell. 1 = all cells.
    gradient_subsample: 1
    random_seed: 42
    # Peer-aware collision avoidance: peer_robot_ids is set via launch arg
    # (e.g. peer_robot_ids:=1,2) — omitted here because empty YAML lists get
    # misinferred as BYTE_ARRAY at param-load time. Each peer subtracts a
    # Gaussian penalty from candidate cells during UCB selection.
    # repulsion_radius is the 1-σ radius (m); repulsion_weight is the peak
    # penalty added at a peer's current cell.
    repulsion_weight: 3.0
    repulsion_radius: 0.3
    peer_pose_timeout: 1.0
    # Hard action mask: destination cells within this radius (m) of any
    # fresh peer are removed from the UCB candidate set. Takes precedence
    # over the Gaussian penalty when set. 0 = disabled (penalty only).
    peer_mask_radius: 0.3
    # Planner-layer (UCB) repulsion is OFF by default. Flip to true here
    # or toggle live by publishing Bool on /collision_avoidance_enabled.
    # Controls BOTH the Gaussian penalty and the hard mask.
    repulsion_enabled: false
    # Edge-margin penalty: keeps UCB waypoints away from the grid
    # boundary. Linear falloff — cells `edge_margin_cells` or more from
    # every edge pay nothing; the outermost ring pays the full weight.
    # Set edge_margin_cells: 0 to disable.
    edge_margin_cells: 2
    edge_margin_weight: 5.0
