robot_navigator:
  ros__parameters:
    robot_id: 0
    linear_gain: 0.5
    angular_gain: 1.2
    max_linear_speed: 0.2
    max_angular_speed: 1.5
    goal_tolerance: 0.05
    angular_tolerance: 0.15
    align_heading: false
    control_rate_hz: 20.0
    camera_pose_timeout: 1.0
    camera_trust: 0.35
    onboard_sensor_timeout: 0.3
    vel_y_flip: true
    attitude_yaw_offset: 0.0
    attitude_yaw_bias_trust: 0.02
    field_frame: "field"
    # Reactive peer repulsion. peer_robot_ids is set via launch arg (e.g.
    # peer_robot_ids:=1,2) — omitted here because empty YAML lists get
    # misinferred as BYTE_ARRAY at param-load time. When a peer enters
    # avoidance_radius, cmd_vel is deflected away (linear falloff to 0).
    #
    # Design intent: this is the EMERGENCY layer. The wider safety
    # boundary is the planner's peer_mask_radius (0.50 m in belief.yaml)
    # — that's the guarantee waypoints aren't placed too close. The
    # reactive layer only fires when something has gone wrong and a peer
    # has slipped INSIDE the planner's no-go zone (e.g. sudden pose
    # update, transient mask gap). So:
    #   - Tight radius  (0.40 m): only acts in the close zone
    #   - Strong gain   (1.0 m/s = 5× max_linear_speed): inside that
    #     zone, repulsion dominates the goal-pull entirely; after
    #     post-clamp to max_linear_speed, the velocity is essentially
    #     pure escape direction. No oscillation because falloff is
    #     monotonic in distance.
    # Linear-falloff strength at key distances (gain=1.0, radius=0.40):
    #   d=0.30 (touch):  0.25 m/s   → clamps escape to max_linear_speed
    #   d=0.20:          0.50 m/s
    #   d=0.10:          0.75 m/s
    #   d≥0.40:          0       → no effect outside the close zone
    avoidance_radius: 0.40
    avoidance_gain: 1.0
    # Drop from 1.0s → 0.4s: at 0.2 m/s a peer drifts 0.2 m in 1 s, more
    # than the entire safety margin. 0.4 s caps unobserved drift at
    # 0.08 m, well within the noise budget, while still tolerating
    # ~3 missed pose frames at the typical 10 Hz pose rate.
    peer_pose_timeout: 0.40
    # Reactive peer repulsion is ON by default — needed for the safety
    # boundary to actually act on cmd_vel. Toggle live by publishing
    # Bool on /collision_avoidance_enabled.
    avoidance_enabled: true
