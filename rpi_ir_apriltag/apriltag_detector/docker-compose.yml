version: "3.9"

services:
  apriltag_detector:
    build:
      context: .
      network: host
    container_name: apriltag_detector
    network_mode: host
    ipc: host
    privileged: true
    volumes:
      - /dev:/dev
      - ./ros_ws/src:/ros_ws/src
      - ./camera_info:/root/.ros/camera_info
      - ../../cyclone_dds.xml:/etc/cyclone_dds.xml:ro
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=/etc/cyclone_dds.xml
    restart: "no"
