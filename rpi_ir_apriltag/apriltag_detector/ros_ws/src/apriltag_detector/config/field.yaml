field_localizer:
  ros__parameters:
    # IDs of the 16h5 corner tags (ordered: top-left, top-right, bottom-right, bottom-left)
    corner_tag_ids: [0, 1, 2, 3]

    # Corresponding real-world field positions in meters, flattened [x0,y0, x1,y1, ...]
    corner_tag_positions: [0.0, 0.0, 3.0, 0.0, 3.0, 2.0, 0.0, 2.0]

    # Field dimensions (for reference / validation)
    field_width: 3.0
    field_height: 2.0
