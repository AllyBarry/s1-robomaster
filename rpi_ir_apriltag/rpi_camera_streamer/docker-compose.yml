version: "3.9"

services:
  camera:
    build: 
      context: .
      network: host
    network_mode: host
    ipc: host
    privileged: true
    volumes:
      - /dev:/dev
      - ./ros_ws/src:/ros_ws/src
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.Xauthority:/root/.Xauthority:ro
      - ./camera_info:/root/.ros/camera_info
      - ./camera_info/camera_settings.txt:/camera_settings.txt:ro
      - ../../cyclone_dds.xml:/etc/cyclone_dds.xml:ro
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=/etc/cyclone_dds.xml
      - QT_X11_NO_MITSHM=1
    entrypoint: ["/entrypoint.sh"]
    command: ros2 launch rpi_camera_streamer webcam.launch.py
    restart: unless-stopped

  calibrate:
    build: 
      context: .
      network: host
    network_mode: host
    ipc: host
    privileged: true
    volumes:
      - /dev:/dev
      - ./ros_ws/src:/ros_ws/src
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.Xauthority:/root/.Xauthority:ro
      - ./camera_info:/tmp/
      - ./camera_info/camera_settings.txt:/camera_settings.txt:ro
      - ../../cyclone_dds.xml:/etc/cyclone_dds.xml:ro
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=/etc/cyclone_dds.xml
      - QT_X11_NO_MITSHM=1
    command: >
      ros2 run camera_calibration cameracalibrator
      --size 4x6
      --square 0.04
      --ros-args
      -r image:=/webcam/image_raw
      -r camera:=/webcam
    restart: "no"
