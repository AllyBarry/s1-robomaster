version: "3.9"

services:
  rpi_camera_streamer:
    build: .
    container_name: rpi_camera_streamer
    network_mode: host
    ipc: host
    privileged: true
    volumes:
      - /dev/bus/usb:/dev/bus/usb
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    restart: "no"
