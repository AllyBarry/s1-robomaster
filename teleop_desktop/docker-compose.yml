version: "3.9"

services:
  teleop:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-ros:humble-ros-core}
    image: teleop_desktop:${TELEOP_TAG:-x86}
    container_name: teleop_gui
    network_mode: host
    ipc: host
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=/etc/cyclone_dds.xml
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.Xauthority:/root/.Xauthority:ro
      - ../cyclone_dds.xml:/etc/cyclone_dds.xml:ro
    restart: "no"

  # Jetson variant — uses L4T-compatible base image and NVIDIA runtime.
  # Run with: BASE_IMAGE=dustynv/ros:humble-pytorch-l4t-r35.3.1 TELEOP_TAG=jetson docker compose up --build teleop-jetson
  teleop-jetson:
    extends:
      service: teleop
    image: teleop_desktop:jetson
    container_name: teleop_gui_jetson
    runtime: nvidia
    privileged: true

  # Full rqt dashboard (use with: docker compose run --rm rqt)
  rqt:
    extends:
      service: teleop
    container_name: teleop_rqt
    command: rqt

  # Keyboard teleop (use with: docker compose run --rm keyboard)
  # Requires interactive terminal - run with -it flags
  keyboard:
    extends:
      service: teleop
    container_name: teleop_keyboard
    stdin_open: true
    tty: true
    command: ros2 run teleop_twist_keyboard teleop_twist_keyboard
